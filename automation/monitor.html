<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Content Runs Monitor</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #18202b; --muted: #687385; --line: #e3e7ed;
    --accent: #0f8f7e; --accent-soft: #dff4f0; --warn: #b7791f; --warn-soft: #fdf3e1;
    --bad: #c2413b; --bad-soft: #fbe7e6; --idle: #5b6b80; --idle-soft: #eceff3;
    --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10141a; --card: #171d25; --ink: #e6ebf2; --muted: #8b97a8; --line: #26303c;
      --accent: #3cc7b2; --accent-soft: #123630; --warn: #e3a948; --warn-soft: #3a2c12;
      --bad: #ef6b63; --bad-soft: #3d1a19; --idle: #9aa7b8; --idle-soft: #212934;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--line); background: var(--card); position: sticky; top: 0; z-index: 2; }
  h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  h1 small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px; border-radius: 999px; font-weight: 600; font-size: 13px; }
  .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .pill.running { color: var(--accent); background: var(--accent-soft); }
  .pill.running::before { animation: pulse 1.4s infinite; }
  .pill.idle { color: var(--idle); background: var(--idle-soft); }
  .pill.warn { color: var(--warn); background: var(--warn-soft); }
  .pill.bad { color: var(--bad); background: var(--bad-soft); }
  @keyframes pulse { 50% { opacity: .25; } }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; font-weight: 600; font-size: 13px; padding: 7px 13px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  main { padding: 20px 24px 40px; display: grid; gap: 16px; max-width: 1400px; margin: 0 auto; }
  .cards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
  .gauge { display: grid; grid-template-columns: 52px minmax(0, 1fr) 44px; gap: 8px; align-items: center; font-size: 13px; margin-top: 6px; }
  .gauge .bar { margin: 0; position: relative; overflow: visible; }
  .gauge .bar > i.hot { background: var(--warn); } .gauge .bar > i.over { background: var(--bad); }
  .gauge .cap { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--ink); opacity: .55; }
  .gauge b { text-align: right; font-variant-numeric: tabular-nums; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
  .big { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; overflow-wrap: anywhere; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .bar { height: 8px; border-radius: 99px; background: var(--idle-soft); margin-top: 10px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s; }
  .grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .feed { max-height: 62vh; overflow: auto; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .ev { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; padding: 6px 8px; border-radius: 8px; }
  .ev .k { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding-top: 2px; }
  .ev .v { white-space: pre-wrap; overflow-wrap: anywhere; }
  .ev.tool .v { font-family: var(--mono); font-size: 12.5px; }
  .ev.tool .k { color: var(--accent); }
  .ev.text { background: var(--idle-soft); }
  .ev.error { background: var(--bad-soft); } .ev.error .k { color: var(--bad); }
  .ev.result { background: var(--accent-soft); }
  .feedhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  select { font: inherit; font-size: 13px; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); max-width: 100%; }
  ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; max-height: 40vh; overflow: auto; }
  ul.list li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; padding: 5px 4px; border-radius: 6px; font-size: 13px; }
  ul.list li.next { background: var(--accent-soft); }
  ul.list li .id { font-family: var(--mono); font-size: 12.5px; font-weight: 600; }
  ul.list li .d { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul.list li.done .id { color: var(--muted); text-decoration: line-through; }
  .mark { text-align: center; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 5px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  td.t { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; width: 1%; }
  td.h { font-family: var(--mono); font-size: 12px; color: var(--accent); width: 1%; }
  .scroll { max-height: 34vh; overflow: auto; }
  .stack { display: grid; gap: 16px; }
  .reports { display: flex; flex-wrap: wrap; gap: 6px; }
  .reports button { font-family: var(--mono); font-weight: 500; font-size: 12px; }
  pre.report { white-space: pre-wrap; font: 13px/1.5 var(--mono); background: var(--idle-soft); padding: 12px; border-radius: 8px; max-height: 50vh; overflow: auto; margin: 10px 0 0; }
  .empty { color: var(--muted); font-style: italic; padding: 8px 0; }
  .toast { position: fixed; bottom: 16px; right: 16px; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 1200px) { .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 1000px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 560px) { header, main { padding-left: 16px; padding-right: 16px; } .cards { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <h1>EnglishAcademy <small>content runs</small></h1>
    <span id="pill" class="pill idle">…</span>
  </div>
  <div class="actions">
    <button class="primary" data-act="run-now" title="Start the next item now">Run now</button>
    <button data-act="stop" class="danger" title="Stop the run in progress (its commits stay)">Stop run</button>
    <button id="pauseBtn" data-act="pause">Pause schedule</button>
  </div>
</header>
<main>
  <section class="cards">
    <div class="card"><h2>Now</h2><div class="big" id="nowItem">–</div><div class="sub" id="nowSub"></div></div>
    <div class="card"><h2>Progress</h2><div class="big" id="prog">–</div><div class="bar"><i id="progBar" style="width:0"></i></div><div class="sub" id="progSub"></div></div>
    <div class="card"><h2>Next scheduled run</h2><div class="big" id="next">–</div><div class="sub" id="nextSub"></div></div>
    <div class="card"><h2>Usage</h2><div id="usage"><div class="sub">No reading yet</div></div><div class="sub" id="usageSub"></div></div>
    <div class="card"><h2>Last run</h2><div class="big" id="last">–</div><div class="sub" id="lastSub"></div></div>
  </section>

  <section class="grid">
    <div class="card">
      <div class="feedhead">
        <h2 style="margin:0">Activity</h2>
        <select id="logSel" aria-label="Run log"></select>
      </div>
      <div class="sub" id="feedMeta" style="margin:-4px 0 10px"></div>
      <div class="feed" id="feed"><div class="empty">No run yet.</div></div>
    </div>
    <div class="stack">
      <div class="card"><h2>Queue</h2><ul class="list" id="queue"></ul></div>
      <div class="card"><h2>Run history</h2><div class="scroll"><table id="runs"></table></div></div>
    </div>
  </section>

  <section class="grid">
    <div class="card"><h2>Commits on <code>content</code></h2><div class="sub" id="diff" style="margin:-4px 0 8px"></div><div class="scroll"><table id="commits"></table></div></div>
    <div class="card"><h2>Reports</h2><div class="reports" id="reports"></div><pre class="report" id="report" hidden></pre></div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtTime = (iso) => iso ? new Date(iso).toLocaleString([], { weekday: 'short', hour: '2-digit', minute: '2-digit' }) : '–';
function rel(iso) {
  if (!iso) return '';
  const s = Math.round((new Date(iso) - Date.now()) / 1000), a = Math.abs(s);
  const t = a < 60 ? `${a}s` : a < 3600 ? `${Math.round(a / 60)} min` : `${Math.floor(a / 3600)} h ${Math.round((a % 3600) / 60)} min`;
  return s >= 0 ? `in ${t}` : `${t} ago`;
}
function dur(ms) { const m = Math.round(ms / 60000); return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`; }
const OUTCOME = { capped: ['Usage cap', 'warn'], done: ['Done', 'running'], partial: ['Partly done', 'warn'], limit: ['Usage limit', 'warn'], auth: ['Login expired', 'bad'], error: ['Failed', 'bad'], 'queue-empty': ['Queue empty', 'idle'] };

let followLive = true, selectedLog = null, lastState = null;

function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2600); }

document.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', async () => {
  const act = b.dataset.act;
  if (act === 'stop' && !confirm('Stop the run in progress? Its commits stay; the next run resumes the item.')) return;
  b.disabled = true;
  try {
    const r = await fetch('/api/action/' + act, { method: 'POST' }).then((x) => x.json());
    toast(r.ok ? ({ 'run-now': 'Run started', stop: 'Run stopped', pause: 'Schedule paused', resume: 'Schedule resumed' })[act] : 'Failed: ' + (r.err || 'unknown'));
  } finally { b.disabled = false; refresh(); }
}));

$('logSel').addEventListener('change', (e) => { selectedLog = e.target.value; followLive = e.target.selectedIndex === 0; loadEvents(); });

async function refresh() {
  let s;
  try { s = await fetch('/api/state').then((r) => r.json()); } catch { $('pill').className = 'pill bad'; $('pill').textContent = 'Monitor offline'; return; }
  lastState = s;
  const st = s.status, task = s.task, running = st?.state === 'running';
  const lastOut = st?.last?.outcome;
  let pill = ['Idle', 'idle'];
  if (running) pill = ['Running', 'running'];
  else if (st?.state === 'stopped') pill = ['Stopped', 'warn'];
  else if (lastOut === 'auth') pill = ['Needs login', 'bad'];
  else if (lastOut === 'capped') pill = ['At usage cap', 'warn'];
  else if (task?.state === 'Disabled') pill = ['Paused', 'warn'];
  else if (!task) pill = ['No schedule', 'warn'];
  $('pill').className = 'pill ' + pill[1]; $('pill').textContent = pill[0];

  const paused = task?.state === 'Disabled';
  $('pauseBtn').dataset.act = paused ? 'resume' : 'pause';
  $('pauseBtn').textContent = paused ? 'Resume schedule' : 'Pause schedule';

  $('nowItem').textContent = running ? st.item : '–';
  $('nowSub').textContent = running ? `${st.desc ?? ''}`.slice(0, 140) + ` · running ${rel(st.started).replace(' ago', '')}` : (st?.state === 'stopped' ? `Stopped: ${st.item}` : 'Nothing running');

  const u = s.usage, cfg = s.config ?? {};
  const gauge = (label, w, cap) => {
    if (!w) return '';
    const p = Math.round(w.percent), cls = cap != null && p >= cap ? 'over' : cap != null && p >= cap - 10 ? 'hot' : '';
    return `<div class="gauge"><span>${label}</span><div class="bar"><i class="${cls}" style="width:${Math.min(100, p)}%"></i>${cap != null ? `<span class="cap" style="left:${cap}%" title="cap ${cap}%"></span>` : ''}</div><b>${p}%</b></div>`;
  };
  if (u) {
    $('usage').innerHTML = gauge('Week', u.sevenDay, cfg.weeklyCapPercent) + gauge('5 h', u.fiveHour, cfg.fiveHourCapPercent);
    $('usageSub').textContent = `Cap ${cfg.weeklyCapPercent ?? '–'}% of week · read ${rel(u.at)}` + (u.sevenDay?.resetsAt ? ` · week resets ${fmtTime(u.sevenDay.resetsAt)}` : '');
  }
  const done = s.queue.filter((q) => q.done).length, total = s.queue.length;
  $('prog').textContent = `${done} / ${total}`;
  $('progBar').style.width = total ? `${(done / total) * 100}%` : '0';
  const nextItem = s.queue.find((q) => !q.done);
  $('progSub').textContent = nextItem ? `Next: ${nextItem.id}` : 'All items done';

  $('next').textContent = paused ? 'Paused' : task?.next ? fmtTime(task.next) : '–';
  $('nextSub').textContent = paused ? 'Schedule is paused' : task?.next ? rel(task.next) + ' · every 5 h' : task ? '' : 'Run install-schedule.ps1';

  if (st?.last) {
    const [label] = OUTCOME[st.last.outcome] ?? [st.last.outcome];
    $('last').textContent = label;
    $('lastSub').textContent = `${st.last.item ?? ''} · ${rel(st.last.ended)}` + (st.last.turns ? ` · ${st.last.turns} turns` : '') + (st.last.durationMs ? ` · ${dur(st.last.durationMs)}` : '') + (st.last.outcome === 'auth' ? ' · run `claude` then /login' : '') + (st.last.reason ? ` · ${st.last.reason}` : '');
  } else { $('last').textContent = '–'; $('lastSub').textContent = ''; }

  $('queue').innerHTML = s.queue.map((q) => `<li class="${q.done ? 'done' : q === nextItem ? 'next' : ''}" title="${esc(q.desc)}"><span class="mark">${q.done ? '✓' : q === nextItem ? (running && st.item === q.id ? '▶' : '→') : '·'}</span><span><span class="id">${esc(q.id)}</span><div class="d">${esc(q.desc)}</div></span></li>`).join('') || '<li class="empty">Queue not found.</li>';
  $('runs').innerHTML = s.runs.map((r) => `<tr><td class="t">${esc(r.at.slice(5))}</td><td>${esc(r.text)}</td></tr>`).join('') || '<tr><td class="empty">No runs yet.</td></tr>';
  $('commits').innerHTML = s.commits.map((c) => `<tr><td class="h">${esc(c.hash)}</td><td class="t">${esc(fmtTime(c.date))}</td><td>${esc(c.subject)}</td></tr>`).join('') || '<tr><td class="empty">No commits yet.</td></tr>';
  $('diff').textContent = s.diff ? `${s.diff.committed || 'no changes yet'}${s.diff.uncommitted ? ` · ${s.diff.uncommitted} uncommitted files in progress` : ''}` : 'Worktree not created yet';

  const rep = $('reports');
  const have = [...rep.querySelectorAll('button')].map((b) => b.textContent).join('|');
  if (have !== s.reports.join('|')) rep.innerHTML = s.reports.map((r) => `<button>${esc(r)}</button>`).join('') || '<div class="empty">No reports yet.</div>';

  const sel = $('logSel');
  const opts = s.logs.map((l) => l.name);
  if (sel.dataset.v !== opts.join('|')) {
    sel.dataset.v = opts.join('|');
    sel.innerHTML = opts.map((n, i) => `<option value="${esc(n)}">${i === 0 ? 'Latest: ' : ''}${esc(n.replace('.log', '').replace('_', ' '))}</option>`).join('');
    if (followLive) selectedLog = opts[0] ?? null;
    if (selectedLog) sel.value = selectedLog;
  }
}

$('reports').addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const pre = $('report');
  if (!pre.hidden && pre.dataset.name === b.textContent) { pre.hidden = true; return; }
  const r = await fetch('/api/report?name=' + encodeURIComponent(b.textContent)).then((x) => x.json());
  pre.textContent = r.text || '(empty)'; pre.dataset.name = r.name; pre.hidden = false;
});

async function loadEvents() {
  if (!selectedLog) return;
  const feed = $('feed');
  const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40;
  const r = await fetch('/api/events?n=150&log=' + encodeURIComponent(selectedLog)).then((x) => x.json()).catch(() => null);
  if (!r) return;
  const c = r.counts ?? {};
  $('feedMeta').textContent = [r.init?.model, `${c.tool ?? 0} tool calls`, `${c.text ?? 0} messages`, c.error ? `${c.error} errors` : '', r.result ? `finished · ${r.result.turns} turns · ${dur(r.result.durationMs)}` : ''].filter(Boolean).join(' · ');
  const evs = r.events.map((e) => `<div class="ev ${e.kind}"><span class="k">${esc(e.kind === 'tool' ? e.name : e.kind === 'text' ? 'Claude' : e.kind)}</span><span class="v">${esc(e.text)}</span></div>`);
  if (r.result) evs.push(`<div class="ev result"><span class="k">Result</span><span class="v">${esc(r.result.text)}</span></div>`);
  feed.innerHTML = evs.join('') || '<div class="empty">Waiting for the first events…</div>';
  if (atBottom || followLive) feed.scrollTop = feed.scrollHeight;
}

refresh().then(loadEvents);
setInterval(refresh, 4000);
setInterval(loadEvents, 3000);
</script>
</body>
</html>
