<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Mobile preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #2b2b2b; font-family: -apple-system, Segoe UI, sans-serif; }
  .toolbar {
    display: flex; gap: 8px; align-items: center; padding: 10px 14px;
    background: #1a1a1a; color: #ddd; font-size: 13px;
  }
  .toolbar a { color: #9ec5ff; text-decoration: none; padding: 4px 10px; border: 1px solid #444; border-radius: 6px; }
  .toolbar a.active { background: #333; color: #fff; }
  .stage { display: flex; justify-content: center; padding: 24px; }
  .phone {
    width: 390px; height: 844px;
    border: 10px solid #111; border-radius: 40px;
    overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.5);
    background: #fff;
  }
  iframe { width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
  <div class="toolbar">
    <span>390&times;844 (iPhone 13 width) — real independent layout viewport, live dev server</span>
    <a href="#" onclick="frame.src='http://localhost:4321/';return false;">Home</a>
    <a href="#" onclick="frame.src='http://localhost:4321/dashboard';return false;">Dashboard</a>
  </div>
  <div class="stage">
    <div class="phone">
      <iframe id="frame" src="http://localhost:4321/"></iframe>
    </div>
  </div>
</body>
</html>
